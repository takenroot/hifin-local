<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HiFin · 个人财务</title>
    <script>
      // 在页面渲染前根据 localStorage 预设主题，避免闪烁
      // - 'dark'：强制暗黑
      // - 'light'：强制浅色（不添加 dark class）
      // - 'system' 或缺失/异常值：跟随系统 prefers-color-scheme
      try {
        var theme = localStorage.getItem('hifin:theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          // 'system' 或缺失/异常值：跟随系统
          if (prefersDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg text-text dark:bg-bg-dark dark:text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
